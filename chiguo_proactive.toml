# ============================================================
# 迟菓主动消息系统 — 配置 v4
# 数学驱动：Poisson + Sigmoid + 半衰期
# ============================================================

# ────────────────────────────────────────────────────────────
# [wechat] 微信发送目标
# 本段仅保留 wechat_recipient（chiguo-tick.sh / wechat-bridge.sh 按 key 名读取发送目标）
# ────────────────────────────────────────────────────────────
[wechat]
wechat_recipient = "owner@im.wechat"   # 发送目标占位符：登录后自动注入真实 openid（~/.chiguo/auth/wechat/credentials.json 的 userId）；
#                                  # 也可在此手动配真实值（非占位符即生效）

[memory]
# ── 记忆后端抽象（v1.8 解耦；v1.9 默认后端 = mem0 AI 记忆层）──
# mem0 唯一后端；backend 仅 mem0 / auto（遗留同义）；其他值抛 ValueError。
backend = "mem0"
# ── mem0 配置（https://github.com/mem0ai/mem0）──
mem0_user_id = "chiguo"                      # mem0 记忆命名空间（user_id）
mem0_collection = "chiguo"                   # qdrant collection 名
mem0_qdrant_path = "data/mem0/qdrant"        # 本地向量库（qdrant 嵌入式，无需 docker）
mem0_history_db = "data/mem0/history.db"     # mem0 操作历史（SQLite）
mem0_llm_model = "deepseek-v4-flash"         # 事实提取 LLM（OpenAI 兼容）
mem0_llm_base_url = "https://opencode.ai/zen/go/v1"
# mem0_llm_api_key = ""                      # 缺省读 ~/.pi/agent/auth.json 的 opencode-go key；勿填明文入库（会进 git 历史）
mem0_embedder_model = "qwen3-embedding:0.6b" # 本地 embedding（ollama）
mem0_embedder_base_url = "http://localhost:11434"
mem0_embedder_dims = 1024                    # qwen3-embedding:0.6b 输出维度
# ── v4: Ebbinghaus 遗忘参数 ──
ebbinghaus_strength = 168    # 记忆强度 S（小时），越大遗忘越慢，168h=7天
ebbinghaus_min_weight = 0.1  # 最低权重（不会彻底遗忘）
# ── B2: 情绪-记忆耦合（默认关闭恒等，可灰度）──
emotion_tagging = false      # 写侧：daemon 对话写入 mem0 时把情绪快照打标进 metadata.emotion_tag（{loneliness/affection/anxiety/energy: low|mid|high + user_mood}）
emotion_tag_weight = 0.0     # 读侧：检索时对情绪相近记忆的加权系数 ×(1+weight×sim)（0=关闭恒等）
# ── C1: 空闲期确定性记忆巩固（对标 Letta dreaming / Deep Dream 无 LLM 版；默认关闭恒等）──
consolidate_enabled = false            # 开启后 daemon 空闲静默路径自动触发 consolidate（也可手动 chiguo_daemon.py --consolidate 接入 cron）
consolidate_sim_threshold = 0.85       # 记忆 text 的 jaccard_3gram 相似度阈值，≥ 视为近似重复 → 保留重要一条、另一条降权
consolidate_min_importance = 0.3       # 低于此重要度且超龄 → 过期候选（删除）
consolidate_max_age_hours = 720.0      # 低重要度记忆的超龄阈值（小时，720=30天）
consolidate_idle_silent_hours = 24.0   # idle 且清醒沉默 ≥ 此小时数才触发巩固（防频繁打扰记忆库）
consolidate_min_interval_hours = 168.0 # 两次巩固最小间隔（小时，防每 tick 重复）
# ── C2: Ebbinghaus 复习强化（对标 FSRS；默认关闭恒等）──
reinforce_enabled = false              # 记忆被召回（search_with_forgetting/random_memory_with_forgetting 返回）时记录 recall_count
reinforce_bonus = 0.0                  # 每次召回 importance ×(1 + bonus×count)；0=关闭恒等
# ── C4: 写全对话轮次（默认单条 user 写入恒等）──
write_full_turns = false               # 写入 mem0 时带上最近一条 assistant 回复（user+assistant 两轮，LLM 提取上下文更全）

[character]
name = "迟菓"
# 人设元数据：供 pi-agent 读取生成消息，代码引擎不使用
age = 14
# 人设元数据：供 pi-agent 读取生成消息，代码引擎不使用
identity = "住在VPS里的赛博少女，哥哥的傲娇助手"
# 人格: 迟菓人格-精简版.md（双版本体系,详版/archive 为参考）

[emotion]
# ── 初始值 ──
loneliness = 15.0       # 孤独值 0-100
affection = 55.0        # 好感度 0-100
anxiety = 40.0          # 不安值 0-100
energy = 85.0           # 元气值 0-100

# ── 半衰期（小时）──
# 价值减半所需时间。越小衰减越快。
loneliness_gain_half_life = 40.0     # 孤独自然增长：40h 走到中点位（原线性2.5/h）
anxiety_gain_half_life = 30.0        # 不安增长：30h 走到中点位
affection_loss_half_life = 500.0     # 好感衰减：极慢，几乎不变
energy_regen_half_life = 8.0         # 元气恢复：8h 恢复一半空缺

# ── 事件半衰期（小时）──
# 收到/发出消息时的情绪骤降速度。越小降得越猛。
loneliness_decay_on_reply = 0.35     # 用户回复：孤独 0.35h 减半（~21分钟）
anxiety_decay_on_reply = 0.5         # 用户回复：不安 0.5h 减半（~30分钟）
loneliness_decay_on_send = 2.0       # 自己发消息：孤独 2h 减半（表达欲满足，缓慢）
anxiety_gain_on_send = 2.0           # 自己发消息：不安小幅上升
energy_cost_per_message = 20.0       # 发一条消耗元气
energy_bonus_on_reply = 10.0         # 收到回复元气奖励

# ── 变化率对 λ 的影响系数 ──
lambda_lo_rate_factor = 0.4    # 孤独暴涨时 λ 放大（Δ/h > 1 的部分 × 0.4）
lambda_anx_rate_factor = 0.3   # 不安暴涨时 λ 放大（Δ/h > 1 的部分 × 0.3）

# ── 好感变化 ──
affection_gain_per_interaction = 0.8

# ── LLM 内容分析微调系数（配合 --analysis 使用）──
# 温暖度 → 好感系数
affection_warmth_factor = 1.5
# 温暖度 → 元气系数
energy_warmth_factor = 4.0
# 负温暖 → 不安回升系数（冷淡回复部分抵消 decay）
anxiety_warmth_recovery = 3.0
# 用心度 → 好感系数
affection_effort_factor = 1.0
# 用心度 → 傲娇软化系数（越用心越融化）
tsundere_effort_factor = 2.0
# 关注度 → 元气系数
energy_attention_factor = 4.0
# 低关注 → 不安系数（被忽视时不安上升）
anxiety_ignore_factor = 2.0

# ── 回复速度分级（小时）──
# 秒回 vs 几小时后回 → 好感/元气/傲娇变化量不同
reply_fast_threshold = 0.0833      # ≤5分钟 = 秒回
reply_slow_threshold = 1.0         # ≤1小时 = 正常
reply_very_slow_threshold = 6.0    # ≤6小时 = 隔了一段时间 (>6h = 很久才回)
reply_fast_affection_mult = 1.5    # 秒回 → 好感倍率
reply_fast_energy_extra = 5.0      # 秒回 → 元气额外奖励
reply_fast_tsundere_extra = 2.0    # 秒回 → 傲娇额外软化
reply_slow_affection_mult = 0.7    # 隔了一段时间 → 好感倍率
reply_very_slow_affection_mult = 0.4  # 很久才回 → 好感倍率
reply_very_slow_anxiety_rebound = 3.0 # 很久才回 → 不安回升

# ── 变化率能量覆盖（孤独暴涨时允许低元气发送）──
rate_energy_override = true     # 是否允许覆盖
rate_energy_threshold = 5.0     # 孤独变化率阈值 (Δ/h)
rate_energy_min = 5.0           # 最低允许元气值

# ── 紧迫通知阈值 ──
urgency_rate_threshold = 3.0    # 孤独变化率大于此 → _build_context 添加紧迫注解
urgency_anx_threshold = 2.0     # 不安变化率大于此 → 添加紧迫注解

# ── A1: 弹性衰减（偏离 target 越远回弹越快）──
elastic_baseline = 100.0   # 弹性基准（情绪值域）；effective_hl = half_life / (1 + |gap|/baseline)

# ── A2: 情绪交互矩阵（乘数=1.0 关闭 → 行为恒等，可安全灰度；>1.0 增强幅度）──
interaction_affection_anxiety = 1.0   # affection>60 → anxiety 恢复加速（anxiety *= 1 - 0.02*k*affection/100）
interaction_energy_loneliness = 1.0   # energy<30 → loneliness 恢复加速（loneliness *= 1 + 0.02*k*(30-energy)/30）
interaction_anxiety_energy = 1.0      # anxiety>70 → energy 恢复减速（energy *= 1 - 0.01*k）

# ── ③ 回复影响惯性阻尼（默认 0 = 关闭恒等，可灰度；>0 压缩单条 analysis delta）──
# 对标 lacuna_core InertiaFilter：单条回复不跳变；负向独立键可设更高（负向更重）。
impact_inertia_positive = 0.0        # 正向 delta 阻尼比例（建议开启值 0.15）
impact_inertia_negative = 0.0        # 负向 delta 阻尼比例（建议开启值 0.35，负向更重）
impact_inertia_affection_mod = 0.0   # 亲密度调制：好感偏离 50 时对 inertia 的缩放（建议 0.5）

# ── ② 情绪自然波动（OU 噪声；enabled=0 关闭 → 行为恒等，可安全灰度）──
# 对标 lacuna_core FluctuationEngine：小幅带均值回归的噪声消除"机械感"。
# 仅作用于 loneliness/anxiety；独立 RNG（noise_seed）不污染全局随机序列。
noise_enabled = 0              # 0=关闭（灰度默认）；1=开启
noise_loneliness_sigma = 0.3   # loneliness 噪声幅度（/√h）
noise_anxiety_sigma = 0.3      # anxiety 噪声幅度（/√h）
noise_theta = 0.5              # OU 回归强度（/h），越大越贴 target
noise_seed = 42                # 独立 RNG 种子（不污染全局 random 序列）

# ── ④ 情绪基线长期漂移（关系动力学；drift_rate=0 关闭 → 行为恒等，可灰度）──
# 对标 astrbot_plugin_emotion_state_machine：长期互动缓慢移动情绪收敛目标（基线），
# 与人格层 regress_to_baseline（防人格漂移）分层——"人格稳定、情绪基线可漂移"。
# 只漂移 loneliness/anxiety/affection 三个关系感受维度；tsundere 全归人格层。
baseline_drift_rate = 0.0              # 0=关闭（灰度默认）；>0 时每次事件漂移 = rate × shift
baseline_shift_loneliness = 0.15       # 单事件漂移量（冷落/冷淡/未回复 → +）
baseline_shift_anxiety = 0.15          # 单事件漂移量（冷淡/未回复 → +；温柔 → −）
baseline_shift_affection = 0.15        # 单事件漂移量（冷落/冷淡/未回复 → −；温柔 → +）
baseline_max_drift = 20.0              # 有界钳位：基线不得超过 [全局默认 ± max_drift]
baseline_forget_half_life = 720.0      # 淡忘半衰期（h；30 天回全局默认，0=不淡忘）

# ── ① 用户情绪感知（user_mood；系数默认 0 = 关闭恒等，可灰度）──
# 对标 ESConv：感知主人情绪（LLM 报 mood/intensity），幅度由系数表决定（决策零 LLM）。
user_mood_low_anxiety_factor = 0.0          # low：anxiety +2.0 × intensity × 系数（心疼 → 不安略升）
user_mood_low_affection_factor = 0.0        # low：affection +0.5 × intensity × 系数（想靠近）
user_mood_distressed_anxiety_factor = 0.0   # distressed：anxiety +3.0 × intensity × 系数
user_mood_distressed_affection_factor = 0.0 # distressed：affection +1.0 × intensity × 系数
user_mood_happy_energy_factor = 0.0         # happy：energy +2.0 × intensity × 系数（被感染）
user_mood_happy_affection_factor = 0.0      # happy：affection +1.0 × intensity × 系数
user_mood_angry_anxiety_factor = 0.0        # angry：anxiety +2.0 × intensity × 系数
user_mood_angry_affection_factor = 0.0      # angry：affection -1.0 × intensity × 系数（克制）
# ── B1: 事件类型化情绪 delta（默认关闭恒等，可灰度）──
# 命中规则表（EVENT_DELTA：praise/criticism/contradiction/comfort/new_topic/question/complaint
# → {loneliness/affection/anxiety} 直接加减）时按事件直接改情绪（不走 impact_inertia 阻尼）。
# 事件类型从 analysis 宽松提取（event_type/event 键 + warmth/user_mood/topic 信号推断）。
event_delta_enabled = false

[sigmoid]
# ── 触发概率的 sigmoid 参数 ──
# P(触发) = 1 / (1 + e^(-k * (loneliness - midpoint)))

loneliness_low_k = 0.20      # 低度试探：柔和过渡
loneliness_low_mid = 38

loneliness_mid_k = 0.18      # 中度嘴硬：略缓（嘴硬需要更多积累）
loneliness_mid_mid = 55

loneliness_high_k = 0.15     # 高度崩溃：最缓（防线不会瞬间垮）
loneliness_high_mid = 78

anxiety_k = 0.12
anxiety_mid = 58

[trigger]
# ── v7: anxiety 触发候选归一化（与孤独三级同款 "不触发基线" softmax 模式）──
# w = raw / (raw + anxiety_baseline * (1 - raw))，归一化权重 > anxiety_min_weight 才成为候选。
# 修复：默认态 anxiety=40 时 raw≈0.103 → 归一化≈0.187 < 0.3 → 不成为候选，
# 沉默期不再确定性发满每日上限的 anxiety 消息；约 anxiety≥48 起激活。
# v1.13 B2(#137)：原 w = raw/(raw+baseline) 把 w_anx 钳在 max≈0.664 < must_send_activation(0.75)，
# 高焦虑永远到不了 A4 高段必发；raw 处补 (1-raw) 项后 raw→1 时 w→1（高焦虑可达 must_send），
# 中低段基本保持（anx=40 → 0.187 vs 原 0.171，仍 <0.3 不成候选）。
anxiety_baseline = 0.5
anxiety_min_weight = 0.3

# ── v7: 接话茬(follow_up)参数 ──
follow_up_weight = 0.35         # 基础权重(乘年龄钟形调制)
follow_up_min_age_hours = 2.0   # 话题最早可接续年龄(小时)
follow_up_max_age_hours = 48.0  # 超过此年龄过期清理(小时)
follow_up_peak_hours = 4.0      # 钟形权重峰值年龄(小时)
follow_up_sigma_hours = 3.0     # 钟形宽度(小时)
follow_up_min_weight = 0.03     # 低于此权重不成为候选

# ── v10 (#73) 触发层三段优化 ──
# A3 日程乘数：情绪类候选权重 × base × uniform(0.8,1.2) 抖动（仪式类豁免）。
#   上课中 ×0.3；空闲（节假日/周末/课间）× free_multiplier；半忙 ×0.6。
free_multiplier = 1.2           # 空闲时情绪类候选乘数（建议 1.0~1.4）
# A4 三段激活阈值：activation = 情绪维度族取 max —— 孤独三级（low/mid/high）是同一
#   维度的互斥表达，族内求和；其余情绪（anxiety/playful/reflect/longing/comfort）
#   各自单源。activation 在抖动前计算，逐状态确定性。
#   < min_activation → 情绪类不参与竞争（低能量沉默，仪式类照发）；
#   >= must_send_activation → 情绪类加权随机必选（仪式类退让），decision 标记 must_send。
# #79: 0.5→0.75 —— 原 0.5 与 softmax 量级不匹配，孤独≥36 即常态触发 must_send，
#       follow_up 永远进不了高段；0.75 后按单源标定：中段（孤独≤35/焦虑≤57 空闲常态）
#       两股中低情绪叠加仅 max≈0.58×1.2<0.75 不触发，孤独≥45 族和或单源焦虑强才必发。
min_activation = 0.08           # 低能量沉默阈值
must_send_activation = 0.75     # 情绪类必发阈值
# A6 统一 repeat 阻尼：trigger_history 按 type 计数 n，候选 weight ×= repeat_decay ** min(n, cap)。
# 对所有 trigger 类型统一生效（替代旧 lonely_high 专属 0.3^n）。
repeat_decay = 0.6              # 每重复一次同类型触发，权重衰减系数
repeat_cap = 3                  # 计数封顶（超过不再继续衰减）

# ── v1.11 ①: 用户情绪感知 → comfort 安慰触发（默认关闭，可灰度）──
# 对标 ESConv：感知到低落/崩溃（user_mood=fresh）→ 更主动安慰。
# comfort 入 EMOTION_TRIGGERS → 自动继承 A3 日程乘数 / A4 三段激活 / A5 退场 / A6 repeat 阻尼。
user_mood_ttl_minutes = 360.0   # user_mood 感知有效窗口（6h，过期不再触发/注解）
user_mood_anxiety_bonus = 0.0   # 低落(low/distressed)时 anxiety 触发权重加成（× (1 + bonus × intensity)，0=关闭）
user_mood_note_enabled = 0      # 语气注解开关（mood_note 注入 _build_context；0=关闭恒等）
comfort_weight_base = 0.0       # comfort 基础权重（0=关闭；>0 时低落在窗口内可触发安慰）
comfort_baseline = 0.5          # comfort 归一化"不触发"基线（raw/(raw+baseline)，同 anxiety 模式）（同 anxiety 模式）
comfort_min_weight = 0.03       # 低于此权重不成为候选

# ── A2: 分类型回复率反馈闭环（enabled=0 关闭 → 行为恒等，可灰度）──
# 对标 revive-companion 的反馈闭环：回复率低 → 该类型 weight ×(1-damp)（降频），
# 回复率高（≥ high_rate）→ ×(1+boost)（微加成）。统计源 = 状态持久化的
# cooldown.reply_stats（daemon 发送时 sent+1、--user-msg 收到回复时 replied+1）。
reply_feedback_enabled = 0      # 0=关闭（恒等）；1=开启
reply_feedback_damp = 0.0       # 低回复率类型权重 ×(1-damp)（0=关闭恒等；1=归零）
reply_feedback_boost = 0.0      # 高回复率类型权重 ×(1+boost)（0=关闭恒等）
reply_feedback_low_rate = 0.3   # 回复率低于此 → 阻尼
reply_feedback_high_rate = 0.7  # 回复率高于此 → 微加成
reply_feedback_min_samples = 3  # 样本数下限（<此数不调整，防冷启动误伤）

[poisson]
# ── Poisson 过程参数 ──
# λ = base_lambda × sigmoid(loneliness) × sigmoid(anxiety)

base_lambda = 0.25           # 基础事件率（次/小时），孤独=0不安=0时
lambda_loneliness_mid = 50   # 孤独 sigmoid 中点
lambda_loneliness_k = 0.08
lambda_anxiety_mid = 45      # 不安 sigmoid 中点
lambda_anxiety_k = 0.06

[topic_picker]
# ── 话题选择器：为孤独触发（lonely_low/mid）提供自然破冰话题 ──
# 各来源权重。系统做加权随机，数值不需要归一化。
schedule_weight = 0.30          # 基于课表/假期/周末
memory_weight = 0.25            # 基于 mem0 记忆
weather_season_weight = 0.20    # 基于季节感知（零依赖）
general_weight = 0.25           # 通用日常关心
solar_terms_weight = 0.10       # 节气话题
anniversary_weight = 0.15       # 纪念日/倒计时
preference_followup_weight = 0.10  # 偏好追问
netease_weight = 0.12                # v9 新增:音乐话题源权重
netease_daily_quota = 2              # v9 新增:音乐话题日配额(每日推荐+播放历史共享)
netease_source_weights = [0.5, 0.5]  # v9 新增:每日推荐 vs 播放历史 随机选源权重
netease_fault_daily_quota = 1        # v9 新增:故障提及日配额

# 话题注入控制
topic_probability = 0.70        # 孤独触发时注入话题的概率（0~1）
force_topic_threshold = 3       # 连续N次都是孤独触发时，强制注入话题
trigger_history_max = 6         # 触发历史记录最大长度
# ── A9: 内容级防复读（行为层）──
# 候选 topic 与最近已发消息文本做 3-gram Jaccard 查重，相似度 ≥ 阈值 → 弃用该候选
# （换下一候选；全部弃用 → topic 空注入）。只作用于候选选择层，不改发不发决策。
repeat_jaccard_threshold = 0.6  # 相似度阈值（0~1）
repeat_history_n = 5            # 对比最近 N 条已发送消息

[schedule]
enabled = true                   # 可选来源：false 时完全不解析课表（缺 xlsx 亦自动禁用，按空闲处理）
quiet_start = 0
quiet_end = 8
morning_start = 8
morning_end = 10
night_start = 20
night_end = 21
# ── schedule-center(批 4):exam_weeks/special_dates 已废弃,迁移至 schedule_overrides.json/anniversaries.json ──
# 旧键:exam_weeks = []   → override kind=exam_week(label="from toml 考试周")
# 旧键:special_dates = ["05-11", "11-03"] → anniversaries.json(迟菓生日默认;其余 name="特殊日期 MM-DD")

# ── 课表 ──
xlsx_path = "data/xskb.xlsx"              # 课表文件，直接替换即可更新
semester_start = "2026-02-23"         # 学期起始日期，换学期改此行
semester_end = "2026-07-04"           # 学期结束日期，之后自动视为假期

[circadian]
# ── v7: 生物钟学习 — 从用户回复时间学习睡眠时段,动态调整静默窗口 ──
history_days = 14        # 回复记录滚动窗口(天)
min_sample_days = 7      # 最少有数据天数才计算学习窗口
min_confidence = 0.5     # 学习置信度低于此值 → 回退配置默认窗口(0-8);默认与 min_sample_days=7 天满安静时的置信度 0.5 匹配
min_width = 5            # 学习窗口最小宽度(小时)
max_width = 12           # 学习窗口最大宽度(小时)

[netease]
enabled = true                   # 可选来源：false 时完全不拉取/告警（缺 cookie 亦自动禁用）
# ── v8: 听歌状态双向联动(夜间活跃反证)──
play_cache_ttl_minutes = 15     # 播放记录缓存 TTL
play_proof_window_hours = 2.0   # 播放证据时间窗(距评估时点)
sleeping_confidence_factor = 0.5  # sleeping 置信度压制系数(有播放证据时)
retry_count = 1                      # v9 新增:瞬时失败重试次数
retry_backoff_seconds = 2.0          # v9 新增:重试退避(秒)
reprobe_minutes = 30                 # v9 新增:登录失效后重探间隔(分钟)

[hawkes]
# ── Hawkes 自激过程（替代 Poisson 独立假设）──
# λ(t) = base_mu + Σ α × exp(-β × (t - t_i))
# 每次触发让 λ 短暂升高（"越想越孤独"正反馈），随后指数衰减
enabled = true
alpha = 0.3         # 单词触发的激发强度
beta = 0.5          # 衰减速率 (1/小时)，半衰期 ≈ ln(2)/0.5 ≈ 1.39h
window_hours = 24   # 只考虑 24h 内的事件

[cooldown]
# ── 硬限制（安全网，Poisson之上）──
max_daily_active = 4
max_daily_silent = 2
# 最小间隔（分钟），防止同1分钟发2条
min_interval_minutes = 30
# 退避：无回复累计时，λ 乘以衰减因子
no_reply_lambda_decay = 0.7   # 每条无回复消息，λ × 0.7
# ── A5: 未回复退场状态机（行为层,与 no_reply_lambda_decay 的 λ 降频是两层独立机制）──
# 0=normal（<3 条未回复）;1=backing_off（3-4 条：情绪类禁发、仪式类照发）;
# 2=silent（≥5 条：全禁发,escape_valve longing 破防豁免——防死锁语义）
backoff_start = 3
backoff_silent = 5
# ── v4: 概率累积 ──
longing_growth_factor = 0.08   # 每次 held λ 增长量
anxiety_block_threshold = 70.0  # 焦虑大于此 → 不累积（"生气了不会找你"）
max_lambda_multiplier = 5.0     # λ 最大倍数
longing_decay_factor = 0.5      # 用户回复后 λ 回退系数
# ── v6: 溢出逃生阀 ──
# 死锁态（焦虑≥block_threshold → 累积 blocked → overflow 永远到不了）
# 改为时间+状态驱动：blocked + 沉默超限 + 冷却外 → 强制破防发送
longing_break_enabled = true            # 逃生阀总开关
longing_break_min_silence_hours = 72    # 高焦虑下沉默多久触发破防（墙钟）
longing_break_cooldown_days = 3         # 破防后冷却天数，防刷屏
# 仪式触发权重缩放（特殊日期/早安/晚安/用餐/记忆等固定事件的权重乘数）
ritual_weight_scale = 1.0               # 默认 1.0；调低可减少仪式触发对情绪触发的压制
# ── A10: 回复饱和阻尼（30 分钟窗口内同向回复次数越多，情绪加成越小，防刷）──
drop_damp_window_minutes = 30   # 同向计数窗口；<=0 关闭阻尼
drop_damp_factor = 0.5          # 第 n 次同向回复 → 加成 × factor^n
drop_damp_max = 3               # 计数上限（min(n, max) 饱和）

# ── v4: 多维人格初始值 ──
[personality]
openness = 55.0
conscientiousness = 65.0
extraversion = 60.0
agreeableness = 65.0
neuroticism = 60.0
tsundere_intensity = 75.0
playfulness = 55.0
attachment_style = 60.0
regress_rate = 0.01                # 基线回归速率（每次互动后向初始值靠拢的比例，防人格漂移；0 = 关闭）

# ── v4: Bayesian 用户状态推断 ──
[bayesian]
learning_rate = 0.05             # 在线学习率（越小越保守）
min_confidence_for_block = 0.5   # 置信度高于此才阻塞发送
utility_threshold = 0.4          # 加权效用高于此推荐发送
escape_valve_sleep_block = 0.9   # 逃生阀豁免时，睡觉置信度≥此值仍降级（默认0.9）
# ── A1: 状态转移矩阵 + 前向滤波（默认关闭恒等，可灰度）──
# transition_enabled=True 时 infer 用 prev_posterior × TRANSITIONS 作转移先验，
# 与时间先验 0.5/0.5 线性混合（状态持续性平滑 + 时段分布兜底）。
# 逐行覆盖（可选）：transition_<state> = { chatting = 0.4, browsing = 0.3, ... }（整行替换 + 归一化）。
transition_enabled = false
# ── A3: 信息增益门控「不确定才发」（默认关闭恒等，可灰度）──
# 后验熵 ≥ info_gain_threshold 时（状态不确定）utility +info_gain_utility_bonus 并放行
# should_send_bayesian——提高探询型消息发送概率。threshold=0 关闭。
info_gain_threshold = 0.0        # 熵门槛（bits，6 状态最大熵 ≈ 2.585；0=关闭）
info_gain_utility_bonus = 0.1    # 熵达门槛时的 utility 上调量（放行探询）

# ── v4: 消息组合系统 ──
[composer]
# combo 尺寸概率
size_1_weight = 0.20
size_2_weight = 0.50
size_3_weight = 0.30
# cue 基础权重（会被 personality 调制；Task 6 原著对齐：经典傲娇为主/温柔关心降权/新增交易式撒娇）
cue_tsundere_weight = 0.40
cue_tsundere_soft_weight = 0.20
cue_tsundere_cool_weight = 0.05
cue_dere_weight = 0.05
cue_playful_weight = 0.15
cue_anxious_weight = 0.10
cue_caring_weight = 0.10
cue_cool_weight = 0.00
cue_trade_weight = 0.15


# ── 安全阀：防止连续崩溃吓到用户 ──
[safety]
enabled = true
crash_cooldown_hours = 24      # lonely_high 触发后 24h 内禁止再次崩溃
crash_window_hours = 48         # 统计窗口
crash_max_in_window = 2         # 48h 内 ≥2 次崩溃 → 强制温和模式

# ── 监控阈值（chiguo_monitor.py health() 使用）──
[monitor]
disk_warn_mb = 500         # 磁盘剩余小于此值 → warn
disk_critical_mb = 100     # 磁盘剩余小于此值 → critical
memory_warn_mb = 500       # 进程 RSS 大于此值 → warn
memory_critical_mb = 1000  # 进程 RSS 大于此值 → critical
# ── D1: 主动消息效果评估（对标 ProactiveEval；默认关闭恒等，不新增输出键）──
proactive_eval = false     # 开启后 stats()/report() 聚合输出 proactive_stats（按 trigger 分组的发送/回复统计 + overall）
replied_within_hours = 24.0  # 发送后此小时数内收到首条 user-msg 视为已回复
# mem0 记忆库路径由主配置 [memory] 段读取（mem0_qdrant_path/mem0_history_db），此处不重复定义

# ── 日志轮转 & 对话存档 (v5) ──
[logging]
retention_months = 12        # 归档保留月数（0 = 永不删除）
archive_dir = "archive"      # 归档目录（相对于 daemon 工作目录）

# ────────────────────────────────────────────────────────────
# [host] 主机/用户（哥哥）运维约束 + agent 调用配置（Phase 4 起由 scripts/agent-run.mjs 读取）
# 运维约束沿用历史 USER.md 迁移内容（Task 3）；Task 14 对齐为正式配置段。
# 配置键：provider/model/thinking_level/reply_thinking_level/session_id/send_session_id/wechat_bridge_url/runner/agent_command
# （AGENTRUN_* 环境变量可覆盖：AGENTRUN_PROVIDER/AGENTRUN_MODEL/AGENTRUN_THINKING/AGENTRUN_SESSION；AGENTRUN_PERSONALITY/AGENTRUN_GUIDE 仅测试/开发用，生产人格固定仓库内 personality/）
# ────────────────────────────────────────────────────────────
[host]
# 沟通：全程中文；直接切入不客套（不要「您好/请问有什么可以帮您」）；默认精简输出，需要细节时哥哥会主动说明
# 输出：命令类内容用可直接复制执行的代码块，不拆分不加前缀；步骤类用有序列表，关键信息加粗；排查先给直接解决方案，原理按需补充
# 安全：高危操作（rm -rf、磁盘格式化、系统重启、服务强制停止、配置覆盖）必须先确认，禁止自动执行
# 备份：修改核心配置、执行破坏性操作前，必须先提示备份方案；备份优先
# 时间：禁止在 22:00 ~ 次日 08:00 主动推送非紧急通知
# 边界：不重复解释 Linux/正则/服务运维等基础概念；不擅自修改核心配置，修改前必须确认
# 环境：Debian Linux, root 用户；记忆库在 data/mem0（qdrant 嵌入式 + ollama 本地 embedding）；
#       常用工具 rsync/systemctl/nano/tar

provider = "opencode-go"        # agent provider：= pi --provider 名与 auth.json 键名（缺省示例；支持 pi 全部内置 provider 与
                                 # ~/.pi/agent/models.json 注册的自定义 OpenAI 兼容端点，见 doc/AGENT_INTEGRATION.md「接入任意模型 API」）
model = "deepseek-v4-flash"     # 对应 provider 的模型（pi --model 支持 provider/id 前缀）
thinking_level = "off"            # 思考模式：off 关闭（pi --thinking 可选 off|minimal|low|medium|high|xhigh|max）
reply_thinking_level = "off"      # 回复侧独立档位（交互及时性:微信消息→回复的 LLM 调用用此档位;主动发送/重分析仍用 thinking_level。可设 medium/high 保响应速度,max 保质量,缺省回退 thinking_level；off=关闭思考）
session_id = "chiguo-main"      # 回复侧会话（bridge askAgent；进程内 TurnQueue 串行）
send_session_id = "chiguo-send" # 主动发送会话（chiguo-tick.sh 经 AGENTRUN_SESSION 注入；与回复会话分离 → 消除跨进程并发 turn）
# ── 每日会话轮换（bridge 内定时器；防上下文堆积，详见 doc/SYSTEM.md §11.2）──
# 语义：每小时整点检查（每天首个检查点 = 00:00 CST）；距最近活动（用户消息 / cron
# 判定要发消息，记于 ~/.chiguo/session-activity-last）超过 idle_minutes 才轮换主会话
# （备份+开新会话，记忆/情绪/课表保留）。有活动则顺延，绝不切断进行中的对话。
session_rotate_enabled = true      # 总开关（false 关闭）
session_rotate_check_minutes = 60  # 检测间隔（分钟；整点对齐）
session_rotate_idle_minutes = 60   # 空闲阈值（分钟）
wechat_bridge_url = "http://127.0.0.1:18790/send"   # 主动发送端点（chiguo-tick.sh curl 目标；--noproxy '*'）

# ── agent 后端抽象（v1.8 解耦：任意替换 agent）──
# runner = "agent"   （默认）pi-agent 二进制（provider/model 见上，AGENTRUN_* 可覆盖）
# runner = "command"  任意 CLI agent：agent_command 指定可执行命令，agent-run.mjs 按统一契约调用：
#                      <agent_command> --prompt <完整提示词> --mode <analysis|send|extract|verify|recall|replan>
#                      期望 stdout JSON：{"ok":true,"text":...,"analysis"?:...,"parsed"?:...,"raw"?:...}
#                      （也兼容 pi 风格 NDJSON message_end）。详见 doc/AGENT_INTEGRATION.md「接入自定义 agent」
runner = "agent"
# agent_command = ["node", "/path/to/my-agent.mjs"]   # command 模式必填；agent 模式忽略

# ── v1.11 C: daemon --loop 常驻（发送侧内聚）──
[loop]
# bridge 常驻服务（持 AgentRpc）：--loop send 分支经此处转发 /agent/prompt 与 /send
bridge_url = "http://127.0.0.1:18790"   # bridge HTTP 服务地址（含 /agent/prompt 与 /send 端点）
bridge_token = ""                       # 与 bridge WECHAT_BRIDGE_TOKEN 同源；空=不带头（向后兼容）
agent_timeout_ms = 125000               # /agent/prompt 超时（agent 生成 LLM 往返兜底）
retry_delay_seconds = 5                 # 生成失败后 sleep 此值再整链重试一次（抖动缓冲，重试成功不计 fail_streak）
probe_interval_seconds = 3600           # 累计失败(fail_streak∈[1,threshold))时距上次尝试的最小间隔（降频探测）

[health]
fail_threshold = 3   # agent 假死判定：连续失败次数 ≥ 此值 → 告警（bridge 记账/tick 记账共用；<1 视为无效回退 3）
